<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100f14" />
      <stop offset="45%" stop-color="#130f18" />
      <stop offset="100%" stop-color="#070507" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="35%" stop-color="rgba(0, 0, 0, 0)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.62)" />
    </radialGradient>
    <filter id="texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 .94 0 0 0  0 0 .88 0 0  0 0 0 1 0" />
      <feGaussianBlur stdDeviation="0.22" />
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bggrad)" />
  <rect width="1920" height="1080" fill="rgba(210, 160, 88, 0.04)" filter="url(#texture)" />
  <rect width="1920" height="1080" fill="url(#vignette)" />
</svg>
